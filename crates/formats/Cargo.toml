[package]
name = "sampan-formats"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Mandate, order and receipt formats v1 (docs/FORMATS.md): parsing, hashing, signature checks."

[dependencies]
# `unstable` exposes env::ecrecover (secp256k1 recovery), needed for ERC-191.
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable"] }
serde_json = "=1.0.154"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable", "unit-testing"] }
base64 = "=0.22.1"
proptest = "=1.12.0"

[lints]
workspace = true

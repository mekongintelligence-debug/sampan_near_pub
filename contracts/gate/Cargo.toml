[package]
name = "sampan-gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Gate contract: holds funds and releases only on a mandate match (M3)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable"] }
sampan-formats = { path = "../../crates/formats", version = "=0.1.0" }
serde_json = "=1.0.154"

[dev-dependencies]
near-sdk = { version = "=5.30.1", default-features = false, features = ["unstable", "unit-testing"] }
ed25519-dalek = { version = "=2.2.0", default-features = false }
proptest = "=1.12.0"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true

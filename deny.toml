# cargo-deny: dependency policy (docs/SECURITY.md 3.6)
[graph]
all-features = false

[advisories]
yanked = "deny"
# Same host-test-only ignores as .cargo/audit.toml; enforced by the
# "ignored advisories never reach the contract build" test.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via near-vm-runner: unit-test harness only, not in the wasm contract" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via near-parameters: unit-test harness only, not in the wasm contract" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

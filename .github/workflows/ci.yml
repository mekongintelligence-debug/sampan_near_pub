name: ci

on:
  push:              # every branch; PR branches live in this repository, so a
                     # separate pull_request trigger would only run CI twice

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history for the secrets scan
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Tools and dependencies
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          scripts/setup-env.sh
      - name: Browser for the checker tests (M6)
        run: pnpm exec playwright install --with-deps chromium
      - name: make check security
        run: make check security   # shared steps run once
